name: Axe accessibility testing

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Check the built portfolio
        run: |
          python3 -m http.server 4321 --directory dist &
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://localhost:4321/ > /dev/null
          npx --yes --package @axe-core/cli axe http://localhost:4321 --chrome-path "${{ steps.chrome.outputs.chrome-path }}" --chrome-options="--no-sandbox" --exit
