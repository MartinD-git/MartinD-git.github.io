name: Deploy site

on:
  push:
    branches: [main, redesign]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cv.txt
      - run: pip install -r requirements-cv.txt
      - name: Generate the latest CV
        run: rendercv render _data/cv.yml --settings assets/rendercv/settings.yaml --design assets/rendercv/design.yaml --locale-catalog assets/rendercv/locale.yaml
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-preview
          path: dist
          include-hidden-files: true

  deploy:
    # Branch builds and pull requests can never write to production.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: github-pages-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: portfolio-preview
          path: dist
      - name: Publish to the existing GitHub Pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
