name: Render a CV

on:
  push:
    paths:
      - "_data/cv.yml"
      - "assets/rendercv/*.yaml"
      - "requirements-cv.txt"
      - ".github/workflows/render-cv.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendercv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cv.txt
      - run: pip install -r requirements-cv.txt
      - run: rendercv render _data/cv.yml --settings assets/rendercv/settings.yaml --design assets/rendercv/design.yaml --locale-catalog assets/rendercv/locale.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: Martin-Daigne-CV
          path: assets/rendercv/rendercv_output/Martin_Daigne_CV.pdf
